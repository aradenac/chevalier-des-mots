site_name: Le Chevalier des Mots
site_description: Référentiel d'exigences du jeu éducatif Le Chevalier des Mots
site_url: ""
use_directory_urls: false
# [impl->verreq~docs.mkdocs-build-pass~1]
repo_url: https://github.com/aradenac/chevalier-des-mots
repo_name: aradenac/chevalier-des-mots
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Accueil: index.md
  - Requirements:
      - Vue d'ensemble: requirements/index.md
      - System overview: requirements/00-system-overview.md
      - Needs: requirements/01-needs.md
      - Stakeholder requirements: requirements/02-stakeholder-requirements.md
      - System requirements: requirements/03-system-requirements.md
      - Software requirements: requirements/04-software-requirements.md
      - Verification requirements: requirements/05-verification-requirements.md
      - Traceability rules: requirements/06-traceability-rules.md
      - Tooling: requirements/07-tooling.md
      - Change process: requirements/08-change-process.md
      - Glossary: requirements/09-glossary.md
