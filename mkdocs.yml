site_name: Le Chevalier des Mots
site_description: Référentiel d'exigences du jeu éducatif Le Chevalier des Mots
site_url: ""
use_directory_urls: false
# [impl->req~verify.docs-build-pass~1]
repo_url: https://github.com/aradenac/chevalier-des-mots
repo_name: aradenac/chevalier-des-mots
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Accueil: index.md
  - Exigences:
      - Vue d'ensemble: requirements/index.md
      - Format: requirements/format.md
      - Règles de rédaction: requirements/writing-rules.md
      - Audit de traçabilité: requirements/traceability-audit.md
      - Gameplay: requirements/gameplay.md
      - Niveaux: requirements/levels.md
      - Interface et entrées: requirements/inputs-ui.md
      - Comptes locaux et progression: requirements/accounts-progress.md
      - Feedback et audio: requirements/feedback-audio.md
      - Technique: requirements/technical.md
      - Vérification: requirements/verification.md
      - Version history: requirements/version-history.md
